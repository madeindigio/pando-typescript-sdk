name: CI

# This workflow lives in — and runs against — the `pando-typescript-sdk`
# repository (`sdk/typescript`'s own remote, see the SDK's README). Its
# checkout root is therefore this package's root: no `working-directory`
# override is needed, unlike a workflow authored from inside the `pando`
# monorepo.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:browser-build

  agui-drift:
    name: AG-UI protocol drift check (PANDO-US-0009)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
      - name: Checkout internal/agui from the pando monorepo
        uses: actions/checkout@v4
        with:
          repository: digiogithub/pando
          # digiogithub/pando is public, so the default GITHUB_TOKEN can check
          # it out and no secret is needed. Should it ever be made private,
          # this needs a PAT with read access to it — the default token only
          # reaches the repository the workflow belongs to. Add a
          # PANDO_MONOREPO_TOKEN repository secret and uncomment the line
          # below if this starts failing with "Repository not found".
          # token: ${{ secrets.PANDO_MONOREPO_TOKEN }}
          sparse-checkout: |
            internal/agui
          path: pando-go-source
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the drift check against the live Go source
        env:
          PANDO_AGUI_GO_DIR: ${{ github.workspace }}/pando-go-source/internal/agui
        run: npm run check:agui-drift

  agui-integration:
    name: HITL round trip against a real agui-serve (PANDO-T-0002)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
      - name: Checkout the pando monorepo
        uses: actions/checkout@v4
        with:
          repository: digiogithub/pando
          # Public, so the default GITHUB_TOKEN suffices. See the note in the
          # agui-drift job if that ever changes.
          path: pando-monorepo
      - uses: actions/setup-go@v5
        with:
          go-version-file: pando-monorepo/go.mod
          cache-dependency-path: pando-monorepo/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The suite builds its own pando binary with -tags agui_fixture_agent and
      # drives a real agui-serve through it, with no LLM credentials. It skips
      # itself when it cannot find a pando module to build from, so this job
      # exists to make sure it does not skip: PANDO_REPO_ROOT points it at the
      # checkout above. A skip here would be silent coverage loss, which is
      # exactly what PANDO-US-0008 and US-0010 sat in review over.
      - name: Run the HITL round trip
        env:
          PANDO_REPO_ROOT: ${{ github.workspace }}/pando-monorepo
        run: npm test -- tests/agui-integration.test.ts
